"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[opener]
edit = [
  { run = 'nvim %*', block = true, for = 'windows' },
  { run = 'nvim "$*"', block = true, for = 'unix' },
  { run = '%*', orphan = true, desc = 'Default', for = 'windows' },
  { run = '$*', orphan = true, desc = 'Default', for = 'unix' },
]
play = [{ run = '%*', orphan = true, desc = 'Default', for = 'windows' }]
convert_hevc = [
  { run = 'pwsh "E:\ps1\path\hevc.ps1" "%1"', block = true, desc = 'Convert to HEVC', for = 'windows' },
]

[open]
append_rules = [{ mime = 'video/*', use = ['convert_hevc'] }]
