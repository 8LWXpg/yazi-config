#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
linemode = 'mtime'

[opener]
edit = [
  { run = 'nvim %*', block = true, for = 'windows' },
  { run = 'nvim "$*"', block = true, for = 'unix' },
  { run = '%*', orphan = true, desc = 'Default', for = 'windows' },
  { run = '$*', orphan = true, desc = 'Default', for = 'unix' },
  { run = 'code %*', orphan = true, desc = 'VSCode', for = 'windows' },
  { run = 'code $*', orphan = true, desc = 'VSCode', for = 'unix' },
]
play = [{ run = '%*', orphan = true, desc = 'Default', for = 'windows' }]
convert_hevc = [
  { run = 'pwsh "E:\ps1\path\hevc.ps1" "-LiteralPath" "%1"', block = true, desc = 'Convert to HEVC', for = 'windows' },
]
drag = [{ run = 'dwag %*', desc = 'Drag', for = 'windows' }]

[open]
append_rules = [
  { mime = '*', use = 'drag', for = 'windows' },
  { mime = 'video/*', use = 'convert_hevc', for = 'windows' },
]
