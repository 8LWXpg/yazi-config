#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on = "f"
run = "plugin jump-to-char"
desc = "Jump to char"

[[mgr.prepend_keymap]]
on = "!"
for = "unix"
run = "shell '$SHELL' --block"
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on = "!"
for = "windows"
run = "shell 'pwsh' --block"
desc = "Open PowerShell here"

[[mgr.prepend_keymap]]
on = ";"
run = "plugin custom-shell -- auto --interactive"
desc = "custom-shell as default, interactive"

[[mgr.prepend_keymap]]
on = ":"
run = "plugin custom-shell -- auto --interactive --wait --block"
desc = "custom-shell as default, interactive, block"

[[mgr.prepend_keymap]]
on = "<C-o>"
run = "shell -- dwag %s"
for = "windows"
desc = "Drag files/folders"

[[mgr.prepend_keymap]]
on = "<C-o>"
run = 'shell -- dwag.exe "$(wslpath -w %s)"'
for = "unix"
desc = "Drag files/folders"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell --block -- scp -P 2222 -r %s user@localhost:~/Downloads/"
desc = "SCP hovered file to SSH client"

[[mgr.append_keymap]]
on = ["g", "o"]
run = "cd ~/Documents"
desc = "Go ~/Documents"

[[mgr.append_keymap]]
on = ["g", "s"]
run = "cd ~/Pictures/Screenshots"
desc = "Go ~/Pictures/Screenshots"
